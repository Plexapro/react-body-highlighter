name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🔍 Type-check
        run: yarn typecheck

      - name: 🧹 Lint check
        run: yarn lint

      - name: 🧪 Run Package Unit Tests
        run: yarn --cwd packages/react-body-highlighter test:coverage

      - name: 🏗️ Build Library Package
        run: yarn build:pkg

      - name: 🚀 Build Showcase Demo App (if present)
        run: |
          if [ -d "apps/demo" ]; then
            yarn build:demo
          else
            echo "Showcase demo app not present in current branch, skipping."
          fi

      - name: 🧪 Run E2E Test Suite
        run: npx tsx tests/e2e/runner.ts

      - name: 📊 Upload Test Coverage
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
